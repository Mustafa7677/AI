<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TULPAR AI — Классқа қосылу</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#08111d;color:#e9f2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#153d55,transparent 40%),#08111d;min-height:100vh}main{max-width:580px;margin:auto;padding:32px 20px}h1{color:#67dce3}section{background:#101f30;border:1px solid #304358;border-radius:20px;padding:24px;margin-top:28px}label{display:block;margin:18px 0 8px;font-weight:700}input{width:100%;background:#081522;border:1px solid #456075;color:white;border-radius:10px;padding:14px;font:inherit}button{margin-top:20px;background:#67dce3;color:#092130;border:0;border-radius:10px;padding:14px 20px;font:inherit;font-weight:750}button:disabled{opacity:.5}a{color:#8ddce8}p{line-height:1.6;color:#a3b7c8}#status{color:#ffd58b;overflow-wrap:anywhere}
</style></head><body><main><a href="./index.html">← TULPAR AI</a><h1>🎓 Классқа қосылу</h1><p>Мұғалім берген Join Code кодын енгіз. API кілті немесе әкімші паролі қажет емес.</p><section><form id="form"><label for="name">Аты-жөнің</label><input id="name" required minlength="2" maxlength="80" autocomplete="name" placeholder="Мысалы: Айдана"><label for="code">Класс коды (Join Code)</label><input id="code" required minlength="6" maxlength="32" autocomplete="off" autocapitalize="characters" placeholder="Мұғалім берген код"><button id="submit" type="submit">Классқа қосылу</button></form><p id="status" role="status"></p></section></main><script>
const endpoint="https://tulpar-classroom.mustafasagid0.workers.dev";
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();const btn=document.getElementById("submit"),status=document.getElementById("status");
 btn.disabled=true;status.textContent="Қосылуда…";
 try{const r=await fetch(endpoint+"/api/class/join",{method:"POST",credentials:"include",headers:{"content-type":"application/json"},body:JSON.stringify({name:document.getElementById("name").value.trim(),code:document.getElementById("code").value.trim().toUpperCase()})});const d=await r.json();if(!r.ok)throw Error(d.error||"Қосылу қатесі");const me=await fetch(endpoint+"/api/me",{credentials:"include"}).then(x=>x.json());if(me.role!=="student")throw Error("Сессия сақталмады. Classroom Worker доменінен тіркелу қажет.");status.textContent="✓ Классқа сәтті қосылдың!";btn.disabled=false;}catch(err){status.textContent="⚠ "+err.message;btn.disabled=false;}
});
</script></body></html>
