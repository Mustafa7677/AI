name = "tulpar-ai-gateway"
main = "gateway.mjs"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGINS = "https://mustafa7677.github.io,http://localhost:8080"
MODEL_PRIORITY = "groq,gemini,openrouter,mistral,deepseek,openai,together,cerebras,fireworks"
